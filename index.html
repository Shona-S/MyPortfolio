<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>vCard - Modular Portfolio</title>

  <link rel="shortcut icon" href="./assets/images/logo.ico" type="image/x-icon">
  <link rel="stylesheet" href="./assets/css/style.css">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body>
  <main>
    <aside class="sidebar" data-sidebar>

      <div class="sidebar-info">

        <figure class="avatar-box">
          <img src="./assets/images/me.png" alt="Shona Senthil Kumar" width="80">
        </figure>

        <div class="info-content">
          <h1 class="name" title="Shona Senthil Kumar">Shona S</h1>

          <p class="title">Data Analyst</p>
        </div>

        <button class="info_more-btn" data-sidebar-btn>
          <span>Show Contacts</span>

          <ion-icon name="chevron-down"></ion-icon>
        </button>

      </div>

      <div class="sidebar-info_more">

        <div class="separator"></div>

        <ul class="contacts-list">

          <li class="contact-item">

            <div class="icon-box">
              <ion-icon name="mail-outline"></ion-icon>
            </div>

            <div class="contact-info">
              <p class="contact-title">Email</p>

              <a href="mailto:shonas3123@gmail.com" class="contact-link">shonas3123@gmail.com</a>
            </div>

          </li>

          <li class="contact-item">

            <div class="icon-box">
              <ion-icon name="phone-portrait-outline"></ion-icon>
            </div>

            <div class="contact-info">
              <p class="contact-title">Phone</p>

              <a href="tel:‪+917812857051‬" class="contact-link">‪+91 7812857051‬</a>
            </div>

          </li>

          <li class="contact-item">

            <div class="icon-box">
              <ion-icon name="calendar-outline"></ion-icon>
            </div>

            <div class="contact-info">
              <p class="contact-title">Birthday</p>

              <time datetime="2005-09-01">Sept 1, 2005</time>
            </div>

          </li>

          <li class="contact-item">

            <div class="icon-box">
              <ion-icon name="location-outline"></ion-icon>
            </div>

            <div class="contact-info">
              <p class="contact-title">Location</p>

              <address>Karur, TamilNadu, India</address>
            </div>

          </li>

        </ul>

        <div class="separator"></div>

        <ul class="social-list">

  <!-- LinkedIn -->
  <li class="social-item">
    <a href="https://www.linkedin.com/in/shona-s" 
       class="social-link" 
       target="_blank" 
       aria-label="LinkedIn">
      <ion-icon name="logo-linkedin"></ion-icon>
    </a>
  </li>

  <!-- GitHub -->
  <li class="social-item">
    <a href="https://github.com/Shona-S" 
       class="social-link" 
       target="_blank" 
       aria-label="GitHub">
      <ion-icon name="logo-github"></ion-icon>
    </a>
  </li>

  <!-- Instagram -->
  <li class="social-item">
    <a href="https://www.instagram.com/your-instagram-username" 
       class="social-link" 
       target="_blank" 
       aria-label="Instagram">
      <ion-icon name="logo-instagram"></ion-icon>
    </a>
  </li>

</ul>


      </div>

    </aside>

    <!-- ========== MAIN CONTENT ========== -->
    <div class="main-content">
      <nav class="navbar">
        <ul class="navbar-list">
          <li class="navbar-item"><button class="navbar-link active" data-nav="about">About</button></li>
          <li class="navbar-item"><button class="navbar-link" data-nav="resume">Resume</button></li>
          <li class="navbar-item"><button class="navbar-link" data-nav="certificates">Certificates</button></li>
          <li class="navbar-item"><button class="navbar-link" data-nav="portfolio">Portfolio</button></li>
          <li class="navbar-item"><button class="navbar-link" data-nav="blog">Blog</button></li>
          <li class="navbar-item"><button class="navbar-link" data-nav="contact">Contact</button></li>
        </ul>
      </nav>

      <!-- where each page loads -->
      <div id="page-container"></div>
    </div>
  </main>

  <script src="./assets/js/script.js"></script>
  <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
</body>
</html>
