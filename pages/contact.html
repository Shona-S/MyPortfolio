<section class="contact-section active" data-page="contact">

  <header>
    <h2 class="h2 article-title">Contact</h2>
  </header>

  <!-- CONTACT FORM -->
  <section class="contact-form">
    <h3 class="h3 form-title">Get in Touch</h3>

    <form id="contact-form" class="form">

      <div class="input-group">
        <input type="text" name="fullname" class="form-input" placeholder="Full Name" required>
      </div>

      <div class="input-group">
        <input type="email" name="email" class="form-input" placeholder="Email Address" required>
      </div>

      <div class="input-group">
        <input type="text" name="phone" class="form-input" placeholder="Phone Number">
      </div>

      <div class="input-group">
        <input type="text" name="subject" class="form-input" placeholder="Subject">
      </div>

      <div class="input-group">
        <textarea name="message" class="form-input textarea-big" placeholder="Your Message" required></textarea>
      </div>

      <button type="submit" class="form-btn">
        <ion-icon name="paper-plane"></ion-icon>
        <span>Send Message</span>
      </button>

    </form>
  </section>

  <!-- CONTACT INFO -->
  <section class="contact-info">
    <ul class="contacts-list horizontal-contacts">

      <li class="contact-item">
        <div class="icon-box">
          <ion-icon name="mail-outline"></ion-icon>
        </div>
        <div class="contact-info">
          <p class="contact-title">Email</p>
          <a href="mailto:shonas3123@gmail.com" class="contact-link">shonas3123@gmail.com</a>
        </div>
      </li>

      <li class="contact-item">
        <div class="icon-box">
          <ion-icon name="call-outline"></ion-icon>
        </div>
        <div class="contact-info">
          <p class="contact-title">Phone</p>
          <a href="tel:+917812857051" class="contact-link">+91 7812857051</a>
        </div>
      </li>

      <li class="contact-item">
        <div class="icon-box">
          <ion-icon name="logo-github"></ion-icon>
        </div>
        <div class="contact-info">
          <p class="contact-title">GitHub</p>
          <a href="https://github.com/Shona-S" target="_blank" class="contact-link">github.com/Shona-S</a>
        </div>
      </li>

      <li class="contact-item">
        <div class="icon-box">
          <ion-icon name="logo-linkedin"></ion-icon>
        </div>
        <div class="contact-info">
          <p class="contact-title">LinkedIn</p>
          <a href="https://www.linkedin.com/in/shona-s/" target="_blank" class="contact-link">linkedin.com/in/shona-s/</a>
        </div>
      </li>

    </ul>
  </section>

</section>
