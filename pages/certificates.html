<header>
  <h2 class="h2 article-title">Certificates</h2>
</header>

<div class="cert-dashboard">
  
  <!-- Overlay for Mobile Sidebar -->
  <div class="cert-overlay" id="cert-overlay"></div>

  <!-- Left Sidebar -->
  <aside class="cert-sidebar" id="cert-sidebar">
    <div class="cert-sidebar-header">
      <h3 class="cert-sidebar-title">Categories</h3>
    </div>
    <ul class="cert-categories">
      <li>
        <button class="cert-cat-btn active" data-category="All">
          <ion-icon name="grid-outline"></ion-icon>
          <span>All</span>
          <span class="cert-cat-count">0</span>
        </button>
      </li>
      <li>
        <button class="cert-cat-btn" data-category="NPTEL">
          <ion-icon name="school-outline"></ion-icon>
          <span>NPTEL</span>
          <span class="cert-cat-count">0</span>
        </button>
      </li>
      <li>
        <button class="cert-cat-btn" data-category="Data Analytics">
          <ion-icon name="bar-chart-outline"></ion-icon>
          <span>Data Analytics</span>
          <span class="cert-cat-count">0</span>
        </button>
      </li>
      <li>
        <button class="cert-cat-btn" data-category="AI & ML">
          <ion-icon name="hardware-chip-outline"></ion-icon>
          <span>AI & ML</span>
          <span class="cert-cat-count">0</span>
        </button>
      </li>
      <li>
        <button class="cert-cat-btn" data-category="Web Development">
          <ion-icon name="code-slash-outline"></ion-icon>
          <span>Web Development</span>
          <span class="cert-cat-count">0</span>
        </button>
      </li>
      <li>
        <button class="cert-cat-btn" data-category="Azure">
          <ion-icon name="cloud-outline"></ion-icon>
          <span>Azure</span>
          <span class="cert-cat-count">0</span>
        </button>
      </li>
      <li>
        <button class="cert-cat-btn" data-category="Soft Skills">
          <ion-icon name="people-outline"></ion-icon>
          <span>Soft Skills</span>
          <span class="cert-cat-count">0</span>
        </button>
      </li>
    </ul>
  </aside>

  <!-- Main Content -->
  <div class="cert-main-content">
    
    <!-- Top Toolbar -->
    <div class="cert-toolbar">
      <button class="cert-mobile-filter-btn" id="cert-mobile-filter-btn">
        <ion-icon name="funnel-outline"></ion-icon>
      </button>

      <div class="cert-search-box">
        <ion-icon name="search-outline"></ion-icon>
        <input type="text" id="cert-search-input" placeholder="Search certificates..." />
      </div>

      <div class="cert-toolbar-actions">
        <span class="cert-total-count" id="cert-total-count">0 Certificates</span>
        
        <div class="cert-sort-box">
          <select id="cert-sort-select" class="cert-sort-select">
            <option value="latest">Latest First</option>
            <option value="oldest">Oldest First</option>
            <option value="provider">By Provider</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Certificate List (Populated by JS) -->
    <div class="cert-list-container" id="cert-list-container">
      <!-- Items will be injected here -->
    </div>

  </div>
</div>
